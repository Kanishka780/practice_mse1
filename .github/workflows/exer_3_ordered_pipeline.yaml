name: Ordered Pipeline

on:
  push:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup complete
        run: echo "Setup done"

  verify:
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify runtime
        run: |
          node --version
          echo "Verify done"

  finish:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Finish pipeline
        run: echo "Pipeline finished"