name: Python Inspector

on:
  push:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inspect Python
        run: |
          python --version
          pip --version
          which python

      - name: Complete inspection
        run: echo "Inspection complete"